# SD card layout.
#
# Partition 1: FAT, the boot partition the ZynqMP BootROM and U-Boot read.
# Partition 2: ext4 root filesystem.
#
# boot.bin is U-Boot SPL acting as the first stage loader, which the BootROM
# loads from the FAT partition. It brings up DDR using psu_init_gpl and then
# loads u-boot.itb, which carries ATF BL31 and U-Boot proper.

image boot.vfat {
	vfat {
		files = {
			"boot.bin",
			"u-boot.itb",
			"system.dtb",
			"Image"
		}
		file extlinux/extlinux.conf {
			image = extlinux.conf
		}
	}

	size = 64M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
